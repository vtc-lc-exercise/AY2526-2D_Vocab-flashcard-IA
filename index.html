<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab Hub - Cyberpunk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: white;
            overflow: hidden;
            touch-action: manipulation; /* 防止手機連撳兩下放大畫面 */
        }

        /* 3D Flip Styles */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-x-180 { transform: rotateX(180deg); }
        .is-flipped { transform: rotateX(180deg); }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.05; }
            50% { transform: translateY(-100px) translateX(50px) rotate(10deg); opacity: 0.15; }
        }
        .floating-emoji {
            position: absolute;
            animation: float infinite linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes fall {
            from { top: -20%; }
            to { top: 100%; }
        }
        .falling-word {
            animation: fall linear forwards;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
        
        .view-section { display: none; }
        .view-section.active { display: flex; }
    </style>
</head>
<body class="h-screen w-full selection:bg-cyan-500/30 relative">

    <!-- Background Effects -->
    <div id="emoji-bg" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <div class="fixed bottom-0 right-0 w-full max-w-2xl aspect-square bg-purple-600/10 rounded-full blur-3xl pointer-events-none z-0 translate-x-1/4 translate-y-1/4"></div>

    <div class="relative z-10 h-full overflow-y-auto overflow-x-hidden">

        <!-- 1. Landing Page -->

                        </div>
                        <h2 class="text-xl md:text-3xl font-black text-slate-100 uppercase tracking-wide">Falling Words</h2>
                    </div>

                </button>

                <button onclick="switchView('view-corners')" class="group relative overflow-hidden bg-slate-800/80 backdrop-blur-md p-5 md:p-6 rounded-3xl shadow-xl hover:shadow-purple-500/30 active:scale-95 transition-all text-left border-2 border-slate-700 hover:border-purple-500 flex flex-col justify-center">
                    <div class="flex items-center mb-2 md:mb-3">

        <!-- 2. Flashcard View -->

                <!-- Feedback Icons -->

                </div>
                <div id="4c-wrong-icon" class="absolute inset-0 flex items-center justify-center z-40 hidden">
                    <i data-lucide="x-circle" class="w-32 h-32 md:w-56 md:h-56 text-red-500 drop-shadow-lg opacity-80"></i>
                </div>
            </div>
        </div>

    </div>

        ];

        const posColors = {
            Verb: "bg-red-500/20 text-red-400 border-red-500/50",
            Noun: "bg-blue-500/20 text-blue-400 border-blue-500/50",
            Adjective: "bg-emerald-500/20 text-emerald-400 border-emerald-500/50",
            Adverb: "bg-amber-500/20 text-amber-400 border-amber-500/50"
        };
        const posTextColors = {
            Verb: "text-red-400",
            Noun: "text-blue-400",
            Adjective: "text-emerald-400",
            Adverb: "text-amber-400"
        };

        // --- Audio ---
        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Background Emojis ---
        function initBackground() {
            const emojis = ['📚', '🎯', '💡', '🎓', '✨', '🚀', '📝', '🧠', '🧩', '🏆', '⭐', '🔥'];
            const container = document.getElementById('emoji-bg');
            for(let i=0; i<15; i++) {
                const el = document.createElement('div');
                el.className = 'floating-emoji text-2xl md:text-4xl';
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 100 + '%';
                el.style.animationDuration = (Math.random() * 20 + 15) + 's';
                el.style.animationDelay = (Math.random() * -20) + 's';
                container.appendChild(el);
            }
        }
        initBackground();

        // --- Navigation ---
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if(viewId === 'view-flashcard') initFlashcards();
            if(viewId === 'view-falling') startFallingGame();
            if(viewId === 'view-corners') start4CGame();
        }

        // --- Flashcards Logic ---
        let fcIndex = 0;
        let fcFlipped = false;

        function initFlashcards() {
            fcIndex = 0;
            fcFlipped = false;
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            const word = rawVocabData[fcIndex];
            document.getElementById('fc-counter').innerText = `${fcIndex + 1} / ${rawVocabData.length}`;
            
            document.getElementById('fc-pos-front').className = `absolute top-4 left-4 md:top-6 md:left-6 px-3 py-1 rounded-full text-xs md:text-sm font-black uppercase tracking-wider border-2 ${posColors[word.pos]}`;
            document.getElementById('fc-pos-front').innerText = word.pos;
            document.getElementById('fc-word').innerText = word.word;
            
            document.getElementById('fc-pos-back').innerText = word.pos;
            document.getElementById('fc-meaning').innerText = word.meaning;
            document.getElementById('fc-collocation').innerText = word.collocation.replace('___', word.word);

            document.getElementById('btn-prev').disabled = fcIndex === 0;
            document.getElementById('btn-next').disabled = fcIndex === rawVocabData.length - 1;

            const inner = document.getElementById('flashcard-inner');
            if(fcFlipped) {
                inner.classList.add('is-flipped');
            } else {
                inner.classList.remove('is-flipped');
                playAudio(word.word);
            }
        }

        function toggleFlashcard() {
            fcFlipped = !fcFlipped;
            const word = rawVocabData[fcIndex];
            if(fcFlipped) playAudio(word.collocation.replace('___', word.word));
            else playAudio(word.word);
            updateFlashcardUI();
        }

        function playFcAudio(e, type) {
            e.stopPropagation();
            const word = rawVocabData[fcIndex];
            if(type === 'word') playAudio(word.word);
            else playAudio(word.collocation.replace('___', word.word));
        }

        function prevCard() { if(fcIndex > 0) { fcIndex--; fcFlipped = false; updateFlashcardUI(); } }
        function nextCard() { if(fcIndex < rawVocabData.length - 1) { fcIndex++; fcFlipped = false; updateFlashcardUI(); } }


        // --- Falling Words Logic ---
        let fwScore = 0;
        let fwLives = 3;
        let fwCurrentWord = null;
        let fwOptions = [];
        let fwFallTimer = null;
        let fwIsGameOver = false;

        function startFallingGame() {
            fwScore = 0;
            fwLives = 3;
            fwIsGameOver = false;
            document.getElementById('fw-game-over').classList.add('hidden');
            document.getElementById('fw-game-over').classList.remove('flex');
            document.getElementById('fw-falling-word').classList.remove('hidden');
            updateFwUI();
            spawnFwWord();
        }

        function updateFwUI() {
            document.getElementById('fw-score').innerText = fwScore;
            let livesHtml = '';
            for(let i=0; i<3; i++) {
                if(i < fwLives) livesHtml += `<i data-lucide="heart" class="w-5 h-5 md:w-8 md:h-8 text-emerald-500 fill-emerald-500 drop-shadow-md"></i>`;
                else livesHtml += `<i data-lucide="heart" class="w-5 h-5 md:w-8 md:h-8 text-slate-700"></i>`;
            }
            document.getElementById('fw-lives').innerHTML = livesHtml;
            lucide.createIcons();
        }

        function spawnFwWord() {
            if(fwIsGameOver) return;
            fwCurrentWord = rawVocabData[Math.floor(Math.random() * rawVocabData.length)];
            
            let opts = new Set([fwCurrentWord.meaning]);
            while(opts.size < 4) {
                opts.add(rawVocabData[Math.floor(Math.random() * rawVocabData.length)].meaning);
            }
            fwOptions = Array.from(opts).sort(() => Math.random() - 0.5);

            const wordEl = document.getElementById('fw-falling-word');
            wordEl.innerText = fwCurrentWord.word;
            
            let optsHtml = '';
            fwOptions.forEach((opt, i) => {
                optsHtml += `<button onclick="handleFwSelect('${opt}')" class="bg-slate-800/80 backdrop-blur-md hover:bg-slate-700 rounded-2xl shadow-lg border-2 border-slate-600 hover:border-emerald-500/80 flex items-center justify-center p-3 md:p-6 text-center text-sm md:text-2xl font-black text-slate-100 active:bg-emerald-900 active:scale-95 transition-all min-h-[4rem] md:min-h-[6rem] leading-tight">${opt}</button>`;
            });
            document.getElementById('fw-options').innerHTML = optsHtml;

            // Reset animation
            wordEl.style.animation = 'none';
            void wordEl.offsetWidth; // trigger reflow
            const duration = Math.max(2.5, 6 - Math.floor(fwScore / 30) * 0.5);
            wordEl.style.animation = `fall ${duration}s linear forwards`;

            clearTimeout(fwFallTimer);
            fwFallTimer = setTimeout(() => {
                handleFwMiss();
            }, duration * 1000);
        }

        function triggerFwShake() {
            const overlay = document.getElementById('fw-shake-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('hidden'), 400);
        }

        function handleFwSelect(selected) {
            if(fwIsGameOver) return;
            clearTimeout(fwFallTimer);
            if(selected === fwCurrentWord.meaning) {
                fwScore += 10;
                playAudio(fwCurrentWord.word);
                updateFwUI();
                spawnFwWord();
            } else {
                triggerFwShake();
                fwLives--;
                updateFwUI();
                if(fwLives <= 0) endFwGame();
                else spawnFwWord();
            }
        }

        function handleFwMiss() {
            if(fwIsGameOver) return;
            triggerFwShake();
            fwLives--;
            updateFwUI();
            if(fwLives <= 0) endFwGame();
            else spawnFwWord();
        }

        function endFwGame() {
            fwIsGameOver = true;
            document.getElementById('fw-falling-word').classList.add('hidden');
            document.getElementById('fw-game-over').classList.remove('hidden');
            document.getElementById('fw-game-over').classList.add('flex');
            document.getElementById('fw-final-score').innerText = fwScore;
            document.getElementById('fw-options').innerHTML = '';
        }


        // --- Four Corners Logic ---
        let c4Data = [];
        let c4Index = 0;
        let c4Score = 0;
        let c4CurrentItem = null;

        function start4CGame() {
            c4Score = 0;
            c4Index = 0;
            document.getElementById('4c-score').innerText = `SCORE: ${c4Score}`;
            
            let shuffled = [...rawVocabData].sort(() => Math.random() - 0.5);
            c4Data = shuffled.map(item => {
                let opts = new Set([item.meaning]);
                while(opts.size < 4) {
                    opts.add(rawVocabData[Math.floor(Math.random() * rawVocabData.length)].meaning);
                }
                return { ...item, options: Array.from(opts).sort(() => Math.random() - 0.5) };
            });
            
            load4CQuestion();
        }

        function load4CQuestion() {
            c4CurrentItem = c4Data[c4Index];
            const parts = c4CurrentItem.collocation.split('___');
            
            let qHtml = '';
            if(parts[0]) qHtml += `<span>${parts[0]}</span>`;
            qHtml += `<span class="${posTextColors[c4CurrentItem.pos]} underline decoration-4 underline-offset-4 md:underline-offset-8">${c4CurrentItem.word}</span>`;
            if(parts[1]) qHtml += `<span>${parts[1]}</span>`;
            
            document.getElementById('4c-question').innerHTML = qHtml;

            for(let i=0; i<4; i++) {
                document.getElementById(`4c-btn-${i}`).innerText = c4CurrentItem.options[i];
            }
        }

        function handle4CTap(optIndex) {
            const selected = c4CurrentItem.options[optIndex];
            if(selected === c4CurrentItem.meaning) {
                c4Score += 10;
                document.getElementById('4c-score').innerText = `SCORE: ${c4Score}`;
                playAudio(c4CurrentItem.word);
                
                document.getElementById('4c-correct-icon').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('4c-correct-icon').classList.add('hidden');
                    c4Index = (c4Index + 1) % c4Data.length;
                    load4CQuestion();
                }, 800);
            } else {
                document.getElementById('fc-wrong-overlay').classList.remove('hidden');
                document.getElementById('4c-wrong-icon').classList.remove('hidden');
                document.getElementById('4c-center-box').classList.add('border-red-500', 'shadow-red-500/50');
                document.getElementById('4c-center-box').classList.remove('border-purple-500/80', 'shadow-purple-500/20');
                
                setTimeout(() => {
                    document.getElementById('fc-wrong-overlay').classList.add('hidden');
                    document.getElementById('4c-wrong-icon').classList.add('hidden');
                    document.getElementById('4c-center-box').classList.remove('border-red-500', 'shadow-red-500/50');
                    document.getElementById('4c-center-box').classList.add('border-purple-500/80', 'shadow-purple-500/20');
                }, 600);
            }
        }
    </script>
</body>
</html>
